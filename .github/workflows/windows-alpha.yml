name: Prepare Windows Alpha

on:
  push:
    branches: [work]
    paths:
      - 'packaging/releases/alpha-request.json'
  workflow_dispatch:
    inputs:
      version:
        description: SemVer matching now_desktop/version.py
        required: true
        default: 0.3.0-alpha.1
        type: string
      branding_reviewed:
        description: I inspected the official original logo and its generated icons
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-alpha-work
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      PYTHONIOENCODING: utf-8
      ENABLE_GEMINI_FALLBACK: 'false'
      OLLAMA_NO_CLOUD: '1'
      REQUESTED_VERSION: ${{ inputs.version }}
      REVIEWED_INPUT: ${{ inputs.branding_reviewed }}
      REQUEST_ACTOR: ${{ github.actor }}
      TRIGGER_ACTOR: ${{ github.triggering_actor }}
      REPOSITORY_OWNER: ${{ github.repository_owner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements-desktop.txt
            packaging/desktop/requirements-build.txt
            packaging/windows/constraints-python312.txt
      - name: Require owner, work and explicit preparation request or manual review
        run: python tools/prepare_alpha.py
      - name: Create isolated build environment
        run: python -m venv .venv-build
      - name: Pin pip
        run: .\.venv-build\Scripts\python.exe -m pip install pip==26.3
      - name: Install pinned build dependencies
        run: .\.venv-build\Scripts\python.exe -m pip install -r packaging/desktop/requirements-build.txt
      - name: Test and build the branded candidate (no publication)
        run: .\.venv-build\Scripts\python.exe tools/build_desktop_windows.py --version "$env:CANDIDATE_VERSION" --branding-reviewed --output "$env:RUNNER_TEMP\now-alpha"
      - name: Record actual results
        if: always()
        run: python tools/ci_summary.py --directory "$env:RUNNER_TEMP\now-alpha"
      - name: Upload tested Alpha for owner review
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: now-assistant-windows-${{ env.CANDIDATE_VERSION }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/now-alpha/*.zip
            ${{ runner.temp }}/now-alpha/BUILD-VALIDACAO.json
            ${{ runner.temp }}/now-alpha/SHA256SUMS.txt
            ${{ runner.temp }}/now-alpha/RELEASE-NOTES.md
            ${{ runner.temp }}/now-alpha/source-tests.json
            ${{ runner.temp }}/now-alpha/packaged-smoke/*.png
