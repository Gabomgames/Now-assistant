name: Windows CI

on:
  push:
    branches: [work]
    paths:
      - '.github/workflows/**'
      - 'now_*/**'
      - 'tools/**'
      - 'tests/**'
      - 'training/**'
      - 'packaging/**'
      - 'requirements*.txt'
  pull_request:
    branches: [work]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 / Python 3.12 / packaged offline checks
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      PYTHONIOENCODING: utf-8
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      ENABLE_GEMINI_FALLBACK: 'false'
      OLLAMA_NO_CLOUD: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements-desktop.txt
            packaging/desktop/requirements-build.txt
            packaging/windows/constraints-python312.txt
      - name: Create isolated build environment
        run: python -m venv .venv-build
      - name: Pin pip
        run: .\.venv-build\Scripts\python.exe -m pip install pip==26.3
      - name: Install pinned build dependencies
        run: .\.venv-build\Scripts\python.exe -m pip install -r packaging/desktop/requirements-build.txt
      - name: Full tests, real Windows build, frozen GUI and Engine smoke
        run: .\.venv-build\Scripts\python.exe tools/build_desktop_windows.py --diagnostic-build --output "$env:RUNNER_TEMP\now-ci"
      - name: Record actual results
        if: always()
        run: python tools/ci_summary.py --directory "$env:RUNNER_TEMP\now-ci"
      - name: Upload diagnostic evidence (not a Release)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: now-assistant-ci-${{ github.sha }}-attempt-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/now-ci/*.zip
            ${{ runner.temp }}/now-ci/BUILD-VALIDACAO.json
            ${{ runner.temp }}/now-ci/source-tests.json
            ${{ runner.temp }}/now-ci/SHA256SUMS.txt
            ${{ runner.temp }}/now-ci/RELEASE-NOTES.md
            ${{ runner.temp }}/now-ci/packaged-smoke/*.png
